# Machine-level shell overrides (survives theme switches).
# Bar thickness 32 logical px: matches the top notch cutout reservation on
# eDP-1 so top and bottom reserved space are identical (see hypr/monitors.lua).
[bar]
size-horizontal = 32
# Top bar v1: the bar's depth and the total top reserve (notch.height
# included). Windows start below it.
height                   = 75
# The bar's fill: the launcher glass with the theme accent mixed in, enough
# to see the bar and the notch cut out of it.
tint                     = 0.22
# Top bar v7: the ears' inner bottom corners, curving back from the notch.
inner-radius             = 16

# Launcher design tokens (phase 1 of the shell-wide refresh).
# Colour values are role names resolved against the active theme's
# colors.toml, so a theme switch re-tints the launcher without editing this
# file. Sizes are logical px; phase 2 (menu bar) can read the same tokens.
[launcher]
panel-background         = "background"
panel-background-alpha   = 0.70
panel-border             = "accent"
panel-border-alpha       = 0.16
text                     = "foreground"
muted                    = "foreground"
muted-alpha              = 0.55
selected-background      = "accent"
selected-background-alpha = 0.16
selected-border          = "accent"
selected-border-alpha    = 0.55
selected-text            = "foreground"
scrim                    = "background"
scrim-alpha              = 0.35
hint-alpha               = 0.66

width                    = 607
max-height               = 459
top-fraction             = 0.16
panel-radius             = 16
row-radius               = 10
panel-padding            = 12
search-padding-x         = 16
search-padding-y         = 14
search-size              = 22
search-weight            = 500
content-gap              = 6
row-height               = 50
row-gap                  = 2
row-padding-x            = 12
icon-size                = 22
name-size                = 15
name-weight              = 500
subtitle-size            = 11
hint-size                = 13
hint-font                = "JetBrainsMono Nerd Font"

# ---------------------------------------------------------------------------
# Top bar restructure (jimmy.bar), frozen in Stage 0, 2026-11-25. Sizes are
# logical px. Code reads these; there are no literals for them in QML.

[notch]
# Camera cutout on eDP-1. height: 64 physical rows from
# /usr/share/omarchy-platform/display-cutouts.json = 32 logical (also the
# monitor reserve in hypr/monitors.lua). width: 190, read by eye on the
# notch ruler (James, 2026-11-27: 95 each side of centre, x 769-959); the
# old 174 (348 physical columns, notch-bar's calibration) was provisional.
width                    = 190
# Clear space between an island and the notch edge.
inset                    = 10
# Keep content clear of the display's rounded top corners.
corner-inset             = 18


[island]
# gap: space above and below each island inside bar.height (44 tall at 2 in 48).
gap                      = 2
# Rounded square rather than pill: about 30% of the 44 height.
# One radius for islands, toasts, notifications and attached panels.
radius                   = 13
# Space inside the ends, and between elements, for every island (the
# status island too). Stage 16: pulled back a little from the 44 / 48
# overshoot.
padding-x                = 36
spacing                  = 38
# Top bar v2: the left island's padding from the screen edge and the notch.
left-padding             = 30
# Faint static accent glow around every island-language outline (islands,
# toasts, notifications, attached panels): alpha 0 turns it off; blur px.
glow-alpha               = 0.32
glow-blur                = 20
# Two islands joined as one divided in two (right + status): the gap between
# them and the radius of the corners that face each other.
joint-gap                = 4
joint-radius             = 2
# Letters and numbers in the islands (time, battery, app name, workspace
# numbers), and glyphs (weather, lights, quick icons, the cup), sized apart.
text-size                = 18
glyph-size               = 20
# Quiet contract: everything but the active workspace, the app name and
# contextual lights sits at this foreground opacity.
quiet-alpha              = 0.72

[band]
# The left island's second level (Top bar v3 tightening, back left in v4):
# gap between its groups and status lights, and between stock widgets
# (their slots carry their own padding).
spacing                  = 10
widget-spacing           = 0

[primary]
# The right ear's primaries (time, battery %, weather), larger than the rest.
text-size                = 26
glyph-size               = 28

[status]
# Spacing between the left ear's status lights (and its top level's
# elements). Glyphs use island.glyph-size. padding-x is unused since Top bar v1.
padding-x                = 18
spacing                  = 20

[battery]
# Percent. On battery, the number turns amber at low and red at critical
# (critical is also the low-battery notification threshold, jimmy.battery).
low                      = 20
critical                 = 10
# Amber: the accent mixed this far toward urgent, to read apart from the
# plugged-in accent.
low-mix                  = 0.45
# Sparks while charging: a small glowing particle with a brief crackle of
# jagged filaments leaves a random point around the number's edge, drifts
# outward and fades, at a random gap between min-ms and max-ms. Core and
# glow diameters and drift in px, life in ms.
spark-size               = 3
spark-glow               = 8
spark-drift              = 9
spark-ms                 = 650
spark-min-ms             = 750
spark-max-ms             = 1500

[quick]
# The quick-toggles strip sliding out left of the right island, ms.
slide-ms                 = 160

[leader]
# false turns the leader letters off (the leader keys keep working).
hints                    = true
# Leader letters on the islands' bottom outline: size, and an optical nudge
# (px, negative = up) so the edge crosses the middle of a capital.
hint-size                = 12
hint-nudge               = -1

[clock]
# Qt time format. "h:mm AP" = 12-hour with AM/PM (Stage 17 reverses Q4):
# 2:38 PM, 9:04 AM. Qt reads "h" as 24-hour unless the format has AP;
# without AP the bar still forces 12-hour and drops the marker.
format                   = "h:mm AP"

[motion]
# jimmy.shared/CardMotion: open springs (X leads, Y lags), fade, close.
x-from                   = 0.80
x-omega                  = 24
x-zeta                   = 0.40
y-from                   = 0.70
y-omega                  = 20
y-zeta                   = 0.46
fade-ms                  = 160
settle-ms                = 700
close-ms                 = 100
close-scale              = 0.97

[toast]
# Toasts grow out of the right island, attached: extra gap below the island (0 = touching).
gap                      = 0
# Space between a toast's border and its content (was island.padding-x).
padding-x                = 10

[agents]
# Usage records shown on the agents icon (ids in ~/.local/state/omarchy/agents/usage).
ids                      = "claude,opencode,grok"
# Red dot when any limit is used past this fraction.
near-limit               = 0.85

[fullscreen]
# Debounce before the bar hides or returns around a fullscreen toggle.
debounce-ms              = 50


[ui]
# Text face for the islands, toasts and pickers (jimmy.bar, jimmy.osd,
# jimmy.emojis, jimmy.clipboard). Icon glyphs keep the Nerd Font.
font                     = "SF Compact Display"
